<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EventHub</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffaf5;
}
.navbar {
    background: linear-gradient(
        135deg,
        #ff512f,
        #f09819
    );
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    color: white;
}
.logo {
    font-size: 25px;
    font-weight: bold;
}
.nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
    margin: 0;
    padding: 0;
}
.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}
.hero {
    text-align: center;
    padding: 50px 20px;
    background: linear-gradient(
        135deg,
        #ff512f,
        #f09819
    );
    color: white;
}
.hero h1 {
    margin: 0;
    font-size: 45px;
}
.hero p {
    font-size: 20px;
}
.events-section {
    max-width: 1200px;
    margin: auto;
    padding: 60px 20px;
}
.events-section h2 {
    text-align: center;
    font-size: 35px;
    margin-bottom: 40px;
}
.events-container {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );
    gap: 25px;
}
.event-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.12);
}
.event-card h3 {
    color: #ff512f;
    font-size: 24px;
    margin-top: 0;
}
.event-card p {
    font-size: 16px;
    margin: 12px 0;
}
.book-btn {
    width: 100%;
    padding: 12px;
    margin-top: 15px;

    border: none;
    border-radius: 25px;
    background: linear-gradient(
        135deg,
        #ff512f,
        #f09819
    );
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.book-btn:hover {
    opacity: 0.9;
}
.book-btn:disabled {
    background: #999;
    cursor: not-allowed;
}
.message {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 18px;
    padding: 40px;
}
.error {
    color: red;
}
@media(max-width:700px) {
    .navbar {
        flex-direction: column;
        gap: 15px;
    }
    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
    }
}
</style>
</head>
<body>
<nav class="navbar">
<div class="logo">
🎉 EventHub
</div>
<ul class="nav-links">
<li>
<a href="index.html">
Home
</a>
</li>
<li>
<a href="events.html">
Events
</a>
</li>
<li>
<a href="mybookings.html">
My Bookings
</a>
</li>
<li>
<a href="login.html">
Login
</a>
</li>
</ul>
</nav>
<section class="hero">
<h1>
🎊 Welcome to EventHub
</h1>
<p>
Discover amazing events and book your tickets today!
</p>
</section>
<section class="events-section">
<h2>
🎉 Upcoming Events
</h2>
<div
    id="eventsContainer"
    class="events-container"
>
<p class="message">
Loading events...
</p>
</div>
</section>
<script>
const API_URL =
    "http://localhost:5000";
async function loadEvents() {
    const container =
        document.getElementById(
            "eventsContainer"
        );
    container.innerHTML = `
        <p class="message">
            Loading events...
        </p>
    `;
    try {
        const response =
            await fetch(
                `${API_URL}/api/events`
            );
        const text =
            await response.text();
        console.log(
            "Event status:",
            response.status
        );
        console.log(
            "Event response:",
            text
        );
        let data;
        try {
            data =
                JSON.parse(text);
        } catch (error) {
            container.innerHTML = `
                <div class="message error">
                    <h3>
                        Invalid server response
                    </h3>
                    <p>
                        The Events API did not return JSON.
                    </p>
                </div>
            `;
            return;
        }
        if (!response.ok) {
            container.innerHTML = `
                <div class="message error">
                    <h3>
                        Unable to load events
                    </h3>
                    <p>
                        ${
                            escapeHTML(
                                data.message ||
                                "Event API request failed."
                            )
                        }
                    </p>
                </div>
            `;
            return;
        }
        let events = [];
        if (
            Array.isArray(data)
        ) {
            events =
                data;
        }
        else if (
            data &&
            Array.isArray(data.events)
        ) {
            events =
                data.events;
        }
        if (
            events.length === 0
        ) {
            container.innerHTML = `
                <div class="message">
                    <h3>
                        No Events Available
                    </h3>
                    <p>
                        Events added by the organizer
                        will appear here.
                    </p>

                </div>
            `;
            return;
        }
        container.innerHTML = "";
        events.forEach(
            function(event) {
                createEventCard(
                    event,
                    container
                );
            }
        );
    } catch (error) {
        console.error(
            "Load Events Error:",
            error
        );
        container.innerHTML = `
            <div class="message error">
                <h3>
                    Unable to connect to server
                </h3>
                <p>
                    Make sure the Node server
                    is running on port 5000.
                </p>

            </div>
        `;

    }
}
function createEventCard(
    event,
    container
) {
    const card =
        document.createElement(
            "div"
        );
    card.className =
        "event-card";
    let dateText =
        "Not Available";
    if (event.date) {
        const eventDate =
            new Date(
                event.date
            );
        if (
            !Number.isNaN(
                eventDate.getTime()
            )
        ) {
            dateText =
                eventDate
                    .toLocaleDateString(
                        "en-US",
                        {
                            year:
                                "numeric",

                            month:
                                "long",

                            day:
                                "numeric"
                        }
                    );
        }
    }
    const seats =
        Number(
            event.seats || 0
        );
    const soldOut =
        seats <= 0;
    card.innerHTML = `
        <h3>
            ${escapeHTML(
                event.title ||
                "Event"
            )}
        </h3>
        <p>
            📍
            <strong>
                Venue:
            </strong>
            ${escapeHTML(
                event.venue ||
                "Not Available"
            )}
        </p>
        <p>
            📅
            <strong>
                Date:
            </strong>
            ${escapeHTML(
                dateText
            )}
        </p>
        <p>
            🎟
            <strong>
                Price:
            </strong>
            ₹${escapeHTML(
                event.price ?? 0
            )}
        </p>
        <p>
            💺
            <strong>
                Available Seats:
            </strong>
            ${seats}
        </p>
        <button
            type="button"
            class="book-btn"
            ${soldOut ? "disabled" : ""}
        >
            ${
                soldOut
                ? "Sold Out"
                : "Book Now"
            }
        </button>
    `;
    const button =
        card.querySelector(
            ".book-btn"
        );
    if (!soldOut) {
        button.addEventListener(
            "click",
            function() {
                bookEvent(
                    event._id
                );
            }
        );
    }
    container.appendChild(
        card
    );
}
async function bookEvent(
    eventId
) {
    const token =
        localStorage.getItem(
            "token"
        );
    if (!token) {
        alert(
            "Please login before booking."
        );
        window.location.href =
            "login.html";
        return;
    }
    const input =
        prompt(
            "Enter number of tickets:"
        );
    if (
        input === null
    ) {
        return;
    }
    const quantity =
        Number(input);
    if (
        !Number.isInteger(quantity) ||
        quantity < 1
    ) {
        alert(
            "Enter a valid number of tickets."
        );
        return;
    }
    try {
        const response =
            await fetch(
                `${API_URL}/api/bookings`,
                {
                    method:
                        "POST",
                    headers: {
                        "Content-Type":
                            "application/json",
                        "Authorization":
                            `Bearer ${token}`
                    },
                    body:
                        JSON.stringify({
                            eventId:
                                eventId,
                            quantity:
                                quantity
                        })
                }
            );
        const text =
            await response.text();
        let data;
        try {
            data =
                JSON.parse(text);
        } catch (error) {
            alert(
                "Booking server returned invalid data."
            );
            return;
        }
        if (
            response.status === 401
        ) {
            alert(
                data.message ||
                "Please login again."
            );
            localStorage.removeItem(
                "token"
            );
            localStorage.removeItem(
                "user"
            );
            window.location.href =
                "login.html";
            return;
        }
        if (!response.ok) {
            alert(
                data.message ||
                "Booking failed."
            );
            return;
        }
        alert(
            "🎉 Booking Successful!"
        );
        window.location.href =
            "mybookings.html";
    } catch (error) {
        console.error(
            "Booking Error:",
            error
        );
        alert(
            "Unable to connect to booking server."
        );
    }
}
function escapeHTML(value) {
    const div =
        document.createElement(
            "div"
        );
    div.textContent =
        String(
            value ?? ""
        );
    return div.innerHTML;
}
loadEvents();
</script>
</body>
</html>

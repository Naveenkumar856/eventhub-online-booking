<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Organizer Dashboard | EventHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fff8ef;color:#333;min-height:100vh}
header{background:linear-gradient(135deg,#ff3d2e,#ff9418);color:#fff;text-align:center;padding:38px 20px}
header h1{font-size:44px;margin-bottom:8px}
header p{font-size:18px}
nav{background:#fff;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;padding:17px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
nav a{color:#e53935;text-decoration:none;font-weight:bold;font-size:17px;padding:10px 18px;border-radius:25px}
nav a:hover{background:#ff5722;color:#fff}
.container{max-width:1200px;margin:auto;padding:40px 20px}
.welcome{text-align:center;margin-bottom:35px}
.welcome h2{font-size:34px;color:#e53935;margin-bottom:8px}
.welcome p{font-size:18px;color:#666}
.form-box{background:#fff;max-width:750px;margin:0 auto 45px;padding:30px;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.form-box h2{text-align:center;color:#e53935;margin-bottom:25px}
.form-group{margin-bottom:17px}
.form-group label{display:block;font-weight:bold;margin-bottom:7px}
.form-group input,.form-group textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.form-group textarea{resize:vertical;min-height:90px}
.submit-btn{width:100%;padding:14px;border:0;border-radius:30px;background:linear-gradient(90deg,#ff3d2e,#ff9418);color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
.submit-btn:hover{opacity:.9}
.section-title{text-align:center;color:#e53935;font-size:34px;margin-bottom:25px}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.event-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 7px 22px rgba(0,0,0,.12);border-top:6px solid #ff5722}
.event-banner{background:linear-gradient(135deg,#ff3d2e,#ff9418);color:#fff;text-align:center;padding:22px;font-size:38px}
.event-content{padding:22px}
.event-content h3{font-size:23px;color:#e53935;margin-bottom:15px}
.event-content p{margin:9px 0;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:18px}
.edit-btn,.delete-btn{flex:1;border:0;padding:11px;border-radius:25px;color:#fff;font-weight:bold;cursor:pointer}
.edit-btn{background:#ff9418}
.delete-btn{background:#e53935}
.message{text-align:center;font-size:19px;color:#e53935;padding:30px;grid-column:1/-1}
.success{color:#218838;text-align:center;margin-top:15px;font-weight:bold}
.error{color:#e53935;text-align:center;margin-top:15px;font-weight:bold}
footer{background:#2d1a14;color:#fff;text-align:center;padding:24px;margin-top:40px}
@media(max-width:600px){header h1{font-size:32px}.container{padding:30px 15px}.section-title{font-size:28px}}
</style>
</head>
<body>
<header>
<h1>🎪 Organizer Dashboard</h1>
<p id="welcomeText">Create and manage festival events</p>
</header>
<nav>
<a href="index.html">🏠 Home</a>
<a href="events.html">🎉 Events</a>
<a href="organizer.html">🎪 Organizer</a>
<a href="mybookings.html">🎟 My Bookings</a>
<a href="#" onclick="logout();return false;">🚪 Logout</a>
</nav>
<main class="container">
<section class="welcome">
<h2>🎊 Event Management</h2>
<p>Create, edit and delete EventHub events</p>
</section>
<section class="form-box">
<h2 id="formTitle">➕ Create New Event</h2>
<form id="eventForm">
<input type="hidden" id="eventId">
<div class="form-group">
<label for="title">Event Title</label>
<input type="text" id="title" required>
</div>
<div class="form-group">
<label for="venue">Venue</label>
<input type="text" id="venue" required>
</div>
<div class="form-group">
<label for="date">Event Date</label>
<input type="date" id="date" required>
</div>
<div class="form-group">
<label for="price">Ticket Price ₹</label>
<input type="number" id="price" min="0" required>
</div>
<div class="form-group">
<label for="seats">Available Seats</label>
<input type="number" id="seats" min="1" required>
</div>
<div class="form-group">
<label for="description">Description</label>
<textarea id="description" placeholder="Enter event description"></textarea>
</div>
<button type="submit" class="submit-btn" id="submitBtn">🎉 Create Event</button>
<div id="formMessage"></div>
</form>
</section>
<h2 class="section-title">🎪 Manage Events</h2>
<section class="events" id="eventsContainer">
<div class="message">Loading events...</div>
</section>
</main>
<footer>🎉 EventHub | Online Event Booking & Management System</footer>
<script>
const token=localStorage.getItem("token");
const savedUser=localStorage.getItem("user");
let currentUser=null;
try{
currentUser=savedUser?JSON.parse(savedUser):null;
}catch(error){
currentUser=null;
}
if(!currentUser){
window.location.href="login.html";
}else{
const role=String(currentUser.role||"").toLowerCase();
if(role!=="organizer"&&role!=="admin"){
window.location.href="events.html";
}else{
document.getElementById("welcomeText").textContent="Welcome "+(currentUser.name||"Organizer")+" — Create and manage festival events";
loadEvents();
}
}
document.getElementById("eventForm").addEventListener("submit",async function(event){
event.preventDefault();
const eventId=document.getElementById("eventId").value;
const eventData={
title:document.getElementById("title").value.trim(),
venue:document.getElementById("venue").value.trim(),
date:document.getElementById("date").value,
price:Number(document.getElementById("price").value),
seats:Number(document.getElementById("seats").value),
description:document.getElementById("description").value.trim()
};
if(!eventData.title||!eventData.venue||!eventData.date||eventData.price<0||eventData.seats<1){
showMessage("Please enter valid event details.",false);
return;
}
try{
const url=eventId?"/api/events/"+eventId:"/api/events";
const method=eventId?"PUT":"POST";
const response=await fetch(url,{
method:method,
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+(token||"")
},
body:JSON.stringify(eventData)
});
const data=await response.json();
if(!response.ok){
showMessage(data.message||"Unable to save event.",false);
return;
}
showMessage(eventId?"Event updated successfully.":"Event created successfully.",true);
resetForm();
loadEvents();
}catch(error){
console.error("SAVE EVENT ERROR:",error);
showMessage("Unable to save event.",false);
}
});
async function loadEvents(){
const container=document.getElementById("eventsContainer");
try{
const response=await fetch("/api/events");
const data=await response.json();
if(!response.ok){
container.innerHTML='<div class="message">'+escapeHtml(data.message||"Unable to load events.")+'</div>';
return;
}
if(!Array.isArray(data)||data.length===0){
container.innerHTML='<div class="message">No events available. Create your first event above.</div>';
return;
}
container.innerHTML="";
data.forEach(event=>{
const card=document.createElement("div");
card.className="event-card";
const eventDate=event.date?new Date(event.date).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}):"Not available";
card.innerHTML=`<div class="event-banner">🎊🎉🎪</div><div class="event-content"><h3>${escapeHtml(event.title||"Event")}</h3><p>📍 <strong>Venue:</strong> ${escapeHtml(event.venue||"Not available")}</p><p>📅 <strong>Date:</strong> ${eventDate}</p><p>💰 <strong>Price:</strong> ₹${Number(event.price)||0}</p><p>💺 <strong>Seats:</strong> ${Number(event.seats)||0}</p><p>📝 ${escapeHtml(event.description||"Festival event")}</p><div class="actions"><button class="edit-btn" onclick='editEvent(${JSON.stringify(JSON.stringify(event))})'>✏ Edit</button><button class="delete-btn" onclick="deleteEvent('${event._id}')">🗑 Delete</button></div></div>`;
container.appendChild(card);
});
}catch(error){
console.error("LOAD EVENTS ERROR:",error);
container.innerHTML='<div class="message">Unable to load events.</div>';
}
}
function editEvent(eventString){
const event=JSON.parse(eventString);
document.getElementById("eventId").value=event._id||"";
document.getElementById("title").value=event.title||"";
document.getElementById("venue").value=event.venue||"";
document.getElementById("date").value=event.date?String(event.date).substring(0,10):"";
document.getElementById("price").value=event.price??"";
document.getElementById("seats").value=event.seats??"";
document.getElementById("description").value=event.description||"";
document.getElementById("formTitle").textContent="✏ Edit Event";
document.getElementById("submitBtn").textContent="💾 Update Event";
document.querySelector(".form-box").scrollIntoView({behavior:"smooth"});
}
async function deleteEvent(id){
if(!confirm("Are you sure you want to delete this event?"))return;
try{
const response=await fetch("/api/events/"+id,{
method:"DELETE",
headers:{
"Authorization":"Bearer "+(token||"")
}
});
const data=await response.json();
if(!response.ok){
alert(data.message||"Unable to delete event.");
return;
}
alert("Event deleted successfully.");
loadEvents();
}catch(error){
console.error("DELETE EVENT ERROR:",error);
alert("Unable to delete event.");
}
}
function resetForm(){
document.getElementById("eventForm").reset();
document.getElementById("eventId").value="";
document.getElementById("formTitle").textContent="➕ Create New Event";
document.getElementById("submitBtn").textContent="🎉 Create Event";
}
function showMessage(message,success){
const element=document.getElementById("formMessage");
element.className=success?"success":"error";
element.textContent=message;
}
function logout(){
localStorage.removeItem("token");
localStorage.removeItem("user");
window.location.href="login.html";
}
function escapeHtml(value){
const element=document.createElement("div");
element.textContent=String(value);
return element.innerHTML;
}
</script>
</body>
</html>
